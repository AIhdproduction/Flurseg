# SAM 3 inference settings.
sam3:
  checkpoint_path: models/sam3.pt # Relative path to the manually supplied checkpoint.
  imgsz: 1008 # Native SAM 3 tile size.
  precision: auto # One of auto, fp32, fp16, or bf16.
  conf: 0.25 # Predictor confidence threshold.
  query_threshold: 0.25 # Minimum query confidence included in dense scores.
  query_fusion_chunk_size: 128 # Maximum query heads combined in one dense-fusion operation.
  prompt_chunk_size: 4 # RTX 4090: 8 prompts reached 20.0 GiB and 16 reached 36.2 GiB with severe paging.
  max_vram_gb: 22 # VRAM budget kept below the 24 GB device capacity.
  slow_chunk_min_seconds: 2.0 # Ignore relative timing outliers below this duration to avoid reacting to scheduler noise.

# Overlapping tile construction.
tiling:
  tile_size: 1008 # Pixel size of each inference tile.
  min_overlap: 0.25 # Minimum fractional overlap between adjacent tiles.

# Class-specific image scales.
scales:
  - factor: 1.0 # Full resolution retains small objects.
    classes: [curb, road_marking, utility_cover, vehicle, other] # Classes evaluated at this scale.
  - factor: 0.5 # Half resolution improves large-area context.
    classes: [ground, paved_surface, low_vegetation, tree, building, construction] # Classes evaluated at this scale.

# Test-time augmentations applied to every tile.
tta:
  variants: [identity, rot90, hflip, vflip] # Supported transform names.

# Optional exemplar behaviour.
exemplars:
  mosaic:
    enabled: false # Experimental cross-image mosaic workaround.
    strip_fraction: 0.2 # Fraction of the canvas reserved for exemplar crops.
    max_per_class: 4 # Maximum exemplar crops for one class.
  find_similar:
    enabled: true # Enable same-image box prompted assistance when available.
    min_instance_score: 0.5 # Minimum instance score retained for same-image visual exemplars.

# Privacy handling for phone images.
anonymization:
  enabled_for: [phone] # Sources that should be anonymized.
  prompts: [person, license plate] # SAM 3 prompts for regions to blur.
  blur_kernel: 31 # Odd Gaussian blur kernel width in pixels.
  blur_sigma: 0.0 # Gaussian sigma; zero lets OpenCV derive it.
  min_score: 0.5 # Minimum score required before a region is blurred.

# Canonical image storage used by ingest.
ingest:
  jpeg_quality: 95 # High quality with no chroma subsampling.

# Orthophoto ingestion defaults.
ortho:
  tile_size: 2048 # Pixel size of extracted orthophoto tiles.
  max_nodata_fraction: 0.5 # Tiles with more nodata are dropped.
  black_threshold: 5 # Pixel values at or below this are considered black.
  gsd_m: 0.10 # Fixed SWISSIMAGE ground sampling distance in metres.

# Class fusion and overlap resolution.
fusion:
  priority_overrides:
    - winner: tree # Higher-scoring tree canopy overrides a vehicle below it.
      loser: vehicle # Competing class affected by this override.
      min_winner_score: 0.5 # Tree score required to apply the override.
  presence_threshold: 0.5 # A class must reach this score before normal priority can select it.
  presence_threshold_per_class: {} # Optional per-class presence thresholds overriding the default.
  priority_margin: 0.15 # Priority may only override a more confident class within this score margin.
  no_prompt_score: 0.15 # Scores below this mean no prompt supplied evidence.

# Independent automatic refinement rules. Execution order: edge_snap (1), color (5), context (4), shape (3), ortho (6), morphology (2).
refinement:
  edge_snap:
    rule_id: 1 # Stable auto-change map rule identifier.
    enabled: true # Align class boundaries to SLIC superpixels and image edges.
    slic_n_segments_per_mp: 1000 # SLIC segments per megapixel.
    compactness: 10.0 # SLIC spatial compactness.
    protected_classes: [curb, road_marking] # Thin classes preserved during edge snapping.
    canny_low_threshold: 50 # Lower Canny threshold used to protect strong image edges.
    canny_high_threshold: 150 # Upper Canny threshold used to protect strong image edges.
    max_edge_fraction: 0.35 # Superpixels with more edge pixels than this remain unchanged.
  morphology:
    rule_id: 2 # Stable auto-change map rule identifier.
    enabled: true # Remove small islands and fill small holes.
    min_island_m2: {ground: 0.25, paved_surface: 0.25, low_vegetation: 0.25, tree: 0.5, building: 0.5, vehicle: 0.5, construction: 0.2, curb: 0.02, road_marking: 0.02, utility_cover: 0.02, other: 0.05} # Minimum retained island area by class when GSD is known.
    min_component_px: {ground: 400, paved_surface: 400, low_vegetation: 400, tree: 600, building: 600, vehicle: 400, construction: 300, curb: 60, road_marking: 60, utility_cover: 60, other: 150} # Minimum retained component size by class when GSD is unknown.
    max_hole_m2: 0.05 # Legacy compatibility setting; holes now use the enclosing class minimum size.
  shape:
    rule_id: 3 # Stable auto-change map rule identifier.
    enabled: true # Apply metric size and compactness checks.
    utility_cover_diameter_m: [0.1, 1.5] # Allowed utility-cover diameter range.
    utility_cover_min_compactness: 0.45 # Minimum utility-cover compactness.
    vehicle_area_m2: [1.5, 40.0] # Allowed vehicle area range.
  context:
    rule_id: 4 # Stable auto-change map rule identifier.
    enabled: true # Mark context violations as ignore.
    vehicle_ring_width_px: 3 # Width of the neighbourhood evaluated around a vehicle component.
    vehicle_on_building_ratio: 0.6 # Building share of that ring that invalidates a vehicle.
    utility_cover_ring_width_px: 5 # Width of the ground-plane neighbourhood evaluated around a utility-cover component.
    utility_cover_ground_ratio: 0.5 # Minimum non-ignore ground-plane share required around a utility cover.
    marking_paved_ring_ratio: 0.3 # Required paved or marking share of a marking component's surrounding ring.
    marking_ring_width_px: 3 # Width of the ring evaluated around every road-marking component.
    curb_max_distance_px: 5 # Maximum distance from a paved-surface border for a curb.
  color:
    rule_id: 5 # Stable auto-change map rule identifier.
    enabled: true # Use guarded colour evidence for ground, paving, and low vegetation.
    exg_threshold: 0.15 # Minimum normalised chromatic ExG to convert ground or paving to low vegetation.
    exg_low_threshold: -0.02 # Maximum normalised chromatic ExG to convert low vegetation back to ground.
    min_brightness: 70 # Minimum mean HSV value of a superpixel before any colour conversion.
    min_target_score: 0.25 # Minimum mean fused low-vegetation score required for a vegetation conversion.
    min_region_px: 3000 # Minimum connected area of a colour conversion; smaller groups are restored.
  ortho:
    rule_id: 6 # Stable auto-change map rule identifier.
    enabled: true # Apply orthophoto-specific minimum dimensions.
    min_small_object_m: 0.4 # Minimum curb or utility-cover size in metres.
    min_marking_width_m: 0.3 # Minimum road-marking width in metres.

# Per-pixel uncertainty scoring.
uncertainty:
  weights:
    top_score: 0.4 # Weight for low winning probability.
    margin: 0.3 # Weight for small best-versus-second margin.
    priority_conflict: 0.3 # Weight for a lower-scoring class selected by priority within the margin.
    tta: 0.2 # Weight for transform disagreement.
    rule_change: 0.1 # Weight for refinement changes.
  threshold: 0.5 # Pixels above this uncertainty become ignore.
  min_region_px: 64 # Small isolated uncertain regions keep their refined class.

# Image-level routing.
routing:
  auto_accept_max_uncertain_fraction: 0.03 # Maximum uncertainty for automatic acceptance.
  auto_accept_max_ignore_fraction: 0.10 # Images with more ignore pixels always go to review.
  spot_check_fraction: 0.10 # Deterministic share sent to review for quality checks.
  seed: 42 # Seed used for reproducible spot checks.

# Local review server settings.
review:
  host: 127.0.0.1 # Loopback-only host for the review server.
  port: 8765 # Local review server port.
  open_browser: true # Open the browser after starting the review server.
  coarse_superpixels_per_mp: 150 # Coarse SLIC segments per megapixel for review UI.

# Dataset construction defaults.
dataset:
  tile_size: 1024 # Pixel size of training tiles.
  max_ignore_fraction: 0.9 # Tiles with more ignore pixels are dropped.
  split:
    train: 0.70 # Fraction of sessions assigned to training.
    val: 0.15 # Fraction of sessions assigned to validation.
    test: 0.15 # Fraction of sessions assigned to testing.
  seed: 42 # Seed used for reproducible session splitting.

# Quality report threshold.
report:
  spot_check_error_limit: 0.02 # Error rate that triggers a report warning.
